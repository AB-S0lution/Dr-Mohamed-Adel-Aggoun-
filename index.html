<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cabinet Saha, Dr Mohamed Adel Aggoun, diabétologie et endocrinologie à Tazoult</title>
  <meta name="description" content="Consultations de diabétologie, d'endocrinologie et de maladies métaboliques à Tazoult, wilaya de Batna. Démonstration de site, non officielle." />
  <!-- ds-allow-hardcode: la barre du navigateur ne lit pas les variables CSS ;
       ces deux valeurs doivent rester synchronisées avec --bg dans main.css. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#091521" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="/Dr-Mohamed-Adel-Aggoun-/favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cabinet Saha, Dr Mohamed Adel Aggoun" />
  <meta property="og:description" content="Diabétologie, endocrinologie et maladies métaboliques à Tazoult, wilaya de Batna." />
  <meta property="og:locale" content="fr_FR" />


  <script>
    // Thème appliqué avant la première peinture pour éviter un flash.
    // Le clair est la valeur par défaut : le sombre est un choix explicite.
    (function () {
      try {
        var t = localStorage.getItem('cabinet-saha-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
